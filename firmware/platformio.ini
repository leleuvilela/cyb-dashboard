; CYD (ESP32-2432S028, 2-USB) dashboard — LVGL 8.3 + TFT_eSPI
; All TFT_eSPI + LVGL config done via build_flags — DO NOT edit library files.
;
; WORKING PANEL CONFIG (verified on this board's ST7789 panel):
;   ST7789_DRIVER + TFT_INVERSION_OFF + TFT_RGB_ORDER=TFT_BGR
;   + LV_COLOR_16_SWAP=1 (lv_conf.h) + pushColors(...,false) in display.cpp
; Note: ST7789 driver forces INVON in init -> TFT_INVERSION_OFF is required, not optional.
; Do not change these unless the panel hardware changes.
[env:cyd]
platform = espressif32@^6.6.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv   ; 3MB app slot (no OTA) — LVGL+TFT needs room
monitor_speed = 115200
upload_speed = 460800

lib_deps =
    lvgl/lvgl@^8.3.11
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    ; ---- logging ---- (LOG_ERROR=1 WARN=2 INFO=3 DEBUG=4; default INFO)
    -D LOG_LEVEL=LOG_INFO
    ; -D LOG_LEVEL=LOG_DEBUG   ; uncomment for verbose serial logs
    -D LOG_NO_COLOR            ; pio monitor doesn't render ANSI color
    ; ---- LVGL ----
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I include
    -D LV_TICK_CUSTOM=1
    ; ---- TFT_eSPI: CYD ESP32-2432S028 ----
    -D USER_SETUP_LOADED=1
    ; -D ILI9341_2_DRIVER=1
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_OFF=1   ; ST7789 driver forces INVON by default; this overrides it
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
